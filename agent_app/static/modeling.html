<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NX 自动建模 · DiskAgent</title><style>
:root{--ink:#183047;--muted:#6d8195;--navy:#10293f;--blue:#2864dc;--line:#e3eaf2;--bg:#f2f5f9;--orange:#b34c21}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header{background:var(--navy);color:#fff;padding:24px max(28px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center}h1{margin:3px 0;font-size:25px}.brand{font-size:11px;letter-spacing:2px;color:#92b9e7}header a{color:#fff;text-decoration:none;border:1px solid #587087;border-radius:18px;padding:5px 12px}.layout{max-width:1180px;margin:auto;padding:24px 28px;display:grid;grid-template-columns:430px 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}h2{font-size:16px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:#526c84}input,select{width:100%;margin-top:5px;padding:9px;border:1px solid #d7e0eb;border-radius:8px;background:#fff}button{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.live{color:var(--orange);border-color:#e5bda8;background:#fff6ef}.actions{display:flex;gap:9px;margin-top:17px}.muted{color:var(--muted);font-size:12px}.status{padding:12px;border-radius:9px;background:#f4f7fb;white-space:pre-wrap}.error{color:#a23d35;background:#fff0ee}pre{font:12px/1.7 Consolas,monospace;background:#f7f9fc;border:1px solid var(--line);padding:14px;border-radius:9px;min-height:220px;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:850px){.layout{display:block;padding:15px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div><div class="brand">DISKAGENT / SIEMENS NX 12</div><h1>参数化自动建模</h1></div><a href="/">返回优化工作台</a></header>
<main class="layout"><div><section class="panel"><h2>圆盘模板</h2><p class="muted">第一版采用受约束模板，不接收任意 NXOpen 代码。先预览，再明确执行。</p><div class="grid">
<label>零件名<input id="name" value="auto_disk" maxlength="64"></label><label>输出格式<select id="format"><option value="prt">NX .prt</option></select></label>
<label>外径 mm<input id="outer" type="number" value="300" min="0.001"></label><label>厚度 mm<input id="thickness" type="number" value="20" min="0.001"></label>
<label>中心孔径 mm<input id="center" type="number" value="60" min="0"></label><label>螺栓孔数量<input id="count" type="number" value="6" min="0" max="128"></label>
<label>螺栓节圆直径 mm<input id="bcd" type="number" value="200" min="0"></label><label>螺栓孔径 mm<input id="bhd" type="number" value="14" min="0"></label></div>
<div class="actions"><button class="primary" id="preview">校验并预览</button><button class="live" id="execute">在 NX 12 中创建</button></div></section><section class="panel"><h2>NX 连接</h2><div id="connection" class="status">检查中…</div></section></div>
<section class="panel"><h2>计划与执行证据</h2><div id="notice" class="status">尚未预览。</div><pre id="result">{}</pre><p class="muted">产物与 Journal 记录在本机 nx_modeling_jobs/，优化器后续可通过同一应用层调用建模，而不依赖页面。</p></section></main><script src="/modeling.js"></script></body></html>
