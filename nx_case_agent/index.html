<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>NX12 案例建模智能体</title>
<style>body{font:16px system-ui;margin:40px auto;max-width:1000px;background:#f4f7fc;color:#183153;padding:0 20px}section{background:white;padding:25px;border-radius:14px;margin:18px 0}textarea{box-sizing:border-box;width:100%;height:120px;font:16px system-ui;padding:12px}button{background:#135ccd;color:white;border:0;border-radius:7px;padding:12px 18px;margin:10px 10px 0 0;cursor:pointer}pre{white-space:pre-wrap;word-break:break-all}small{color:#526780}.params{display:flex;gap:12px;flex-wrap:wrap}.params label{width:200px}.params input{display:block;padding:7px;width:170px}</style>
<h1>NX12 案例建模智能体</h1><p>自然语言需求 → 案例配方补全 → 参数核对 → NX原生建模与验证</p>
<section><button onclick="choose('geom2d')">二维轮盘</button><button onclick="choose('new160')">单叶片轮盘</button><p><small>缺失尺寸使用案例初值。二维采用圆弧过渡；三维采用简化盘体和三截面叶片放样，当前省略叶根圆角。</small></p><textarea id="text"></textarea><button onclick="preview()">理解描述并补全参数</button><div id="parameters" class="params"></div><button id="build" onclick="build()" disabled>在NX12中建模</button></section><section><strong id="status">就绪</strong><pre id="result"></pre></section>
<script>
const prompts={geom2d:'请在NX12建立一个内外端厚、中间薄、上下对称的二维轮盘截面，内侧位置83毫米，五段径向跨度和四个半厚度可编辑，过渡平滑。',new160:'请在NX12建立带一片叶片的三维轮盘局部模型，包含轮毂、薄盘和加厚外缘，叶片向外伸出并逐渐收窄，主要尺寸参数化。'};let current=null;
function choose(k){document.querySelector('#text').value=prompts[k];current=null;document.querySelector('#build').disabled=true;document.querySelector('#parameters').replaceChildren()}
async function api(action,data){let path='/'+action;const headers={'Content-Type':'application/json'};if(location.pathname==='/case-modeling'){const c=await(await fetch('/api/config')).json();headers['X-CSRF-Token']=c.csrf_token;path='/api/nx/cases/'+action}const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(data)});const v=await r.json();if(!r.ok||v.ok===false)throw Error(typeof v.error==='string'?v.error:v.error?.message||'执行失败');return v}
function show(v){document.querySelector('#result').textContent=JSON.stringify(v,null,2)}
async function preview(){document.querySelector('#status').textContent='正在理解并补全…';document.querySelector('#build').disabled=true;try{current=await api('plan',{description:document.querySelector('#text').value});show(current);const host=document.querySelector('#parameters');host.replaceChildren();Object.entries(current.parameters).forEach(([key,value])=>{const l=document.createElement('label');l.textContent=key;const i=document.createElement('input');i.type='number';i.step='any';i.value=value;i.oninput=()=>current.parameters[key]=Number(i.value);l.append(i);host.append(l)});document.querySelector('#build').disabled=false;document.querySelector('#status').textContent='已补全，请核对参数和简化说明。'}catch(e){document.querySelector('#status').textContent=e.message}}
document.querySelector('#text').addEventListener('input',()=>{current=null;document.querySelector('#build').disabled=true});
async function build(){if(!current)return;document.querySelectorAll('button').forEach(b=>b.disabled=true);document.querySelector('#status').textContent='NX正在建模、修改参数验证并重新打开，请等待…';try{const v=await api('build',{description:current.description,parameters:current.parameters});show(v);document.querySelector('#status').textContent='完成：'+v.output}catch(e){document.querySelector('#status').textContent=e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}choose('geom2d');
</script></html>
